name: "CI - Test Features"
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
  # pull_request:
  workflow_dispatch:
    inputs:
      feature:
        description: 'Single feature to test (leave empty to test all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - aws-cli-base
          - cfn-tools
          - github
          - python-ext
          - terraform-tools
          - uv

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.set.outputs.features }}
    steps:
      - id: set
        env:
          FEATURE: ${{ inputs.feature }}
        run: |
          if [ -n "$FEATURE" ]; then
            echo "features=[\"$FEATURE\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'features=["aws-cli-base","cfn-tools","github","python-ext","terraform-tools","uv"]' >> "$GITHUB_OUTPUT"
          fi

  test-autogenerated:
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features: ${{ fromJSON(needs.setup.outputs.features) }}
        baseImage:
          - ubuntu:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

